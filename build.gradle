import org.gradle.testing.jacoco.tasks.JacocoCoverageVerification

plugins {
    id 'java'
    id 'application'
    id 'jacoco'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.gradlex.extra-java-module-info' version '1.14.2'
    id 'org.sonarqube' version '7.5.0.8588'
    id 'org.cyclonedx.bom' version '3.5.1'
}

group = 'system'
// Release builds pass -PreleaseVersion (or RELEASE_VERSION) from the git tag.
version = providers.gradleProperty('releaseVersion')
        .orElse(providers.environmentVariable('RELEASE_VERSION'))
        .getOrElse('1.0-SNAPSHOT')

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 27
}

extraJavaModuleInfo {
    // Test-only jars (Testcontainers and its dependencies) have no module metadata;
    // they run on the test classpath and must not fail the production module patch.
    failOnMissingModuleInfo = false
    // Password4j has neither a module descriptor nor an Automatic-Module-Name.
    automaticModule('com.password4j:password4j', 'com.password4j')
}

application {
    mainModule = 'system.chatsystem'
    // Override with -PmainClass=... to build a distribution for another entry point.
    mainClass = providers.gradleProperty('mainClass')
            .getOrElse('com.haichutieu.chatsystem.server.ServerApp')
    // Hibernate and several other dependencies are automatic modules that are not
    // reachable through 'requires' alone; resolve everything shipped in lib/.
    applicationDefaultJvmArgs = ['--add-modules', 'ALL-MODULE-PATH', '--enable-native-access=javafx.graphics']
}

javafx {
    version = '27.0.1'
    modules = ['javafx.base', 'javafx.graphics', 'javafx.controls', 'javafx.fxml']
}

sourceSets {
    main {
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    integrationTest {
        java.srcDir 'src/integrationTest/java'
        resources.srcDir 'src/integrationTest/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    fxTest {
        java.srcDir 'src/fxTest/java'
        resources.srcDir 'src/fxTest/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
    fxTestImplementation.extendsFrom testImplementation
    fxTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'

    // Real PostgreSQL 18 for persistence and socket integration tests.
    integrationTestImplementation 'org.testcontainers:testcontainers:2.0.5'
    integrationTestImplementation 'org.testcontainers:postgresql:1.21.4'
    integrationTestImplementation 'org.awaitility:awaitility:4.3.0'
    integrationTestImplementation 'com.icegreen:greenmail:2.1.15'

    // Hibernate ORM (Jakarta Persistence 3.2)
    implementation platform("org.hibernate.orm:hibernate-platform:7.4.15.Final")
    implementation "org.hibernate.orm:hibernate-core"
    implementation "org.hibernate.orm:hibernate-hikaricp"
    implementation 'com.zaxxer:HikariCP:7.1.0'
    implementation "jakarta.transaction:jakarta.transaction-api:2.0.1"
    // jakarta.transaction's module descriptor requires the CDI and interceptor APIs.
    implementation 'jakarta.interceptor:jakarta.interceptor-api:2.2.0'
    implementation 'jakarta.enterprise:jakarta.enterprise.cdi-api:5.0.0'

    implementation 'org.postgresql:postgresql:42.7.14' // postgresql driver

    implementation 'com.password4j:password4j:1.8.4' // Argon2id password hashing

    // create log
    implementation 'org.slf4j:slf4j-api:2.0.20'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.20'

    implementation 'tools.jackson.core:jackson-databind:3.2.4' // json mapper

    // password reset mail
    implementation 'jakarta.mail:jakarta.mail-api:2.1.5'
    implementation 'org.eclipse.angus:angus-mail:2.0.5'
}

// Tests run on the classpath: the application module would otherwise hide test
// dependencies and require --add-opens for Hibernate, ArchUnit and Testcontainers.
tasks.named('compileTestJava') {
    modularity.inferModulePath = false
}
tasks.matching { it.name in ['compileIntegrationTestJava', 'compileFxTestJava'] }.configureEach {
    modularity.inferModulePath = false
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    modularity.inferModulePath = false
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }
    reports.junitXml.required = true
    reports.html.required = true
    maxHeapSize = '2g'
}

tasks.named('test') {
    description = 'Runs fast unit tests (no Docker, no display).'
    systemProperty 'junit.jupiter.execution.timeout.default', '60 s'
}

def integrationTest = tasks.register('integrationTest', Test) {
    description = 'Runs PostgreSQL 18 and TCP socket integration tests (requires Docker).'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
    maxParallelForks = 1
    systemProperty 'junit.jupiter.execution.timeout.default', '5 min'
}

def fxTest = tasks.register('fxTest', Test) {
    description = 'Runs JavaFX toolkit and FXML loading tests (requires a display or Xvfb).'
    group = 'verification'
    testClassesDirs = sourceSets.fxTest.output.classesDirs
    classpath = sourceSets.fxTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
    systemProperty 'junit.jupiter.execution.timeout.default', '60 s'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.register('fullTest') {
    group = 'verification'
    description = 'Runs unit, integration and JavaFX test suites.'
    dependsOn tasks.named('test'), integrationTest, fxTest,
            ':desktop-user:fxTest', ':desktop-admin:fxTest'
}

jacoco {
    toolVersion = '0.8.16'
}

tasks.named('jacocoTestReport', JacocoReport) {
    // JavaFX coverage is optional here so the Sonar job never needs a display.
    dependsOn tasks.named('test'), integrationTest
    executionData fileTree(layout.buildDirectory.get().asFile).include('jacoco/*.exec')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

// Anti-regression gate for the packages that have meaningful executable coverage
// today. The aspirational targets (auth 90%, services 85%, DAL 80%, etc.) are
// documented in docs/CI-CD.md; these minimums are the current measured baseline
// and must be raised as the remaining workflows gain tests.
def coverageVerification = tasks.register('coverageVerification', JacocoCoverageVerification) {
    group = 'verification'
    description = 'Fails when measured coverage drops below the recorded baseline.'
    dependsOn tasks.named('test'), integrationTest
    // Core gate: unit + PostgreSQL/socket integration. JavaFX coverage is
    // reported when fxTest has run but is not a dependency of CI's build job.
    executionData files(
            layout.buildDirectory.file('jacoco/test.exec'),
            layout.buildDirectory.file('jacoco/integrationTest.exec')
    )
    classDirectories.setFrom(sourceSets.main.output)
    violationRules {
        rule {
            element = 'BUNDLE'
            limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.19 }
            limit { counter = 'BRANCH'; value = 'COVEREDRATIO'; minimum = 0.13 }
        }
        rule {
            element = 'PACKAGE'
            includes = ['com.haichutieu.chatsystem.server.dal']
            limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.68 }
            limit { counter = 'BRANCH'; value = 'COVEREDRATIO'; minimum = 0.60 }
        }
        rule {
            element = 'PACKAGE'
            includes = ['com.haichutieu.chatsystem.server']
            limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.45 }
            limit { counter = 'BRANCH'; value = 'COVEREDRATIO'; minimum = 0.40 }
        }
        rule {
            element = 'PACKAGE'
            includes = ['com.haichutieu.chatsystem.util']
            limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.85 }
            limit { counter = 'BRANCH'; value = 'COVEREDRATIO'; minimum = 0.80 }
        }
    }
}

tasks.named('fullTest') {
    dependsOn coverageVerification
}

sonar {
    properties {
        property 'sonar.host.url', 'https://sonarcloud.io'
        property 'sonar.sourceEncoding', 'UTF-8'
        property 'sonar.projectKey', 'hoanhophuoc_Chat-System'
        property 'sonar.organization', 'hoanhophuoc'
        property 'sonar.coverage.jacoco.xmlReportPaths',
                layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile.absolutePath
        property 'sonar.tests', 'src/test/java,src/integrationTest/java,src/fxTest/java'
        property 'sonar.java.test.binaries',
                'build/classes/java/test,build/classes/java/integrationTest,build/classes/java/fxTest'
        property 'sonar.qualitygate.wait', 'true'
        property 'sonar.qualitygate.timeout', '300'
    }
}

tasks.named('sonar') {
    dependsOn tasks.named('jacocoTestReport')
}


// IntelliJ's generated run task puts the whole runtime classpath on the module path
// but does not add the application's default JVM args. Without this, optional
// modules such as org.jboss.logging (used by Hibernate) are never resolved.
tasks.withType(JavaExec).configureEach {
    jvmArgs '--add-modules', 'ALL-MODULE-PATH', '--enable-native-access=javafx.graphics'
}

tasks.register('runClient', JavaExec) {
    group = 'application'
    description = 'Runs the user chat client.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.haichutieu.chatsystem.client.ClientLauncher'
}

tasks.register('runAdmin', JavaExec) {
    group = 'application'
    description = 'Runs the admin chat client.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.haichutieu.chatsystem.client.AdminLauncher'
}

// ---------------------------------------------------------------------------
// Native desktop packages (jpackage) for the two JavaFX clients.
// Run each task on its target OS; jpackage never cross-compiles.
//   ./gradlew packageClient -PpackageType=app-image
//   ./gradlew packageClient -PpackageType=deb
// ---------------------------------------------------------------------------

def appImageVersion = providers.gradleProperty('appVersion').getOrElse('1.0.0')
def packageType = providers.gradleProperty('packageType').getOrElse('app-image')
// The desktop clients do not use the server persistence or mail stack.
def desktopExcludes = [
        'hibernate-*', 'HikariCP-*', 'postgresql-*', 'jakarta.transaction-*',
        'jakarta.enterprise-*', 'jakarta.interceptor-*', 'jakarta.mail-*',
        'jakarta.activation-*', 'jakarta.xml.bind-*', 'jakarta.annotation-*',
        'jakarta.inject-*', 'jakarta.el-*', 'angus-*', 'jaxb-*', 'txw2-*',
        'istack-*', 'jboss-logging-*', 'byte-buddy-*', 'antlr4-*', 'checker-qual-*'
]

def registerJpackage = { String taskName, String appName, String mainClass, String description ->
    tasks.register(taskName, Exec) {
        group = 'distribution'
        this.description = description
        dependsOn tasks.named('jar')
        def inputDir = layout.buildDirectory.dir("package/${appName}/input")
        def destDir = layout.buildDirectory.dir("package/${appName}/out")
        doFirst {
            delete inputDir.get().asFile, destDir.get().asFile
            copy {
                from(configurations.runtimeClasspath) {
                    desktopExcludes.each { pattern -> exclude pattern }
                }
                from tasks.named('jar').get().archiveFile
                into inputDir
            }
            commandLine 'jpackage',
                    '--type', packageType,
                    '--name', appName,
                    '--app-version', appImageVersion,
                    '--vendor', 'Chat System',
                    '--input', inputDir.get().asFile.absolutePath,
                    '--main-jar', tasks.named('jar').get().archiveFileName.get(),
                    '--main-class', mainClass,
                    '--dest', destDir.get().asFile.absolutePath,
                    '--java-options', '-Dfile.encoding=UTF-8',
                    '--java-options', '--enable-native-access=ALL-UNNAMED'
        }
    }
}

registerJpackage('packageClient', 'ChatSystemClient',
        'com.haichutieu.chatsystem.client.ClientLauncher',
        'Builds the user client with jpackage (app-image, deb, msi or dmg).')
registerJpackage('packageAdmin', 'ChatSystemAdmin',
        'com.haichutieu.chatsystem.client.AdminLauncher',
        'Builds the admin client with jpackage (app-image, deb, msi or dmg).')
