import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.testing.jacoco.tasks.JacocoCoverageVerification

plugins {
    id 'java'
    id 'jacoco'
    id 'org.sonarqube' version '7.5.0.8588'
    id 'org.cyclonedx.bom' version '3.5.1'
}

group = 'com.nexus'
// Release builds pass -PreleaseVersion (or RELEASE_VERSION) from the git tag.
version = providers.gradleProperty('releaseVersion')
        .orElse(providers.environmentVariable('RELEASE_VERSION'))
        .getOrElse('1.0-SNAPSHOT')

repositories {
    mavenCentral()
}

// This project holds no product code: the Spring Boot server and the two JavaFX apps are
// the modules in settings.gradle. The root build owns only the aggregate verification
// task, the coverage gate, and the Sonar/SBOM configuration.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 27
}

jacoco {
    toolVersion = '0.8.16'
}

// Coverage for the modules that carry the product. The legacy monolith that used to be
// this project's own source set is gone, so the gate has to name the modules it measures.
def coverageModules = [':server', ':desktop-shared', ':desktop-user', ':desktop-admin']

// The two desktop modules are covered by their JavaFX suites, whose exec data is only present
// after those suites ran (locally through fullTest, in CI as an artifact from the fx-test job).
def uiCoverageModules = [':desktop-user', ':desktop-admin']

def coverageClassDirectories = { -> coverageModules.collect { project(it).sourceSets.main.output } }
def coverageSourceDirectories = { -> coverageModules.collect { project(it).sourceSets.main.allSource.srcDirs } }
def coverageExecutionData = { ->
    coverageModules.collect { project(it).layout.buildDirectory.file('jacoco/test.exec').get().asFile } +
            [project(':server').layout.buildDirectory.file('jacoco/integrationTest.exec').get().asFile] +
            uiCoverageModules.collect { project(it).layout.buildDirectory.file('jacoco/fxTest.exec').get().asFile }
}
// A report can be generated from whatever ran; the gate below refuses to guess.
def existingCoverageExecutionData = { ->
    files(provider { coverageExecutionData().findAll { it.exists() } })
}

// Both consumers read exec data from a previous build once the suites are up-to-date, and the fx
// suites are not dependencies of the report, so a figure can silently describe an older tree.
// This refuses data that is missing or older than the sources it claims to cover.
def coverageDataCheck = tasks.register('coverageDataCheck') {
    group = 'verification'
    description = 'Fails when the JaCoCo data the coverage tasks read is missing or predates the sources.'
    dependsOn ':server:test', ':server:integrationTest', ':desktop-shared:test'
    mustRunAfter ':desktop-user:test', ':desktop-admin:test',
            ':desktop-user:fxTest', ':desktop-admin:fxTest'
    notCompatibleWithConfigurationCache('compares exec timestamps and test reports at execution time')
    doLast {
        def relative = { File file -> rootDir.toPath().relativize(file.toPath()).toString() }
        def moduleOf = { File file -> relative(file).split('/')[0] }
        def newestSource = [:]
        def sourcesChangedAt = { String module ->
            newestSource.computeIfAbsent(module) {
                project(":${module}").fileTree('src').files.collect { it.lastModified() }.max() ?: 0L
            }
        }
        def execFiles = coverageExecutionData()
        // Timestamps cannot see a partial run, so every suite is held to the test classes it
        // compiled: "--tests '...'" leaves the rest of its classes with no report, and a suite that
        // skipped one at runtime has no report for it either.
        def suites = [
                ':server:test'             : ['server', 'test'],
                ':server:integrationTest'  : ['server', 'integrationTest'],
                ':desktop-shared:test'     : ['desktop-shared', 'test'],
                ':desktop-user:test'       : ['desktop-user', 'test'],
                ':desktop-user:fxTest'     : ['desktop-user', 'fxTest'],
                ':desktop-admin:test'      : ['desktop-admin', 'test'],
                ':desktop-admin:fxTest'    : ['desktop-admin', 'fxTest']]
        def unrunTests = [:]
        suites.each { suite, moduleAndSourceSet ->
            def sourceSet = moduleAndSourceSet[1]
            File classes = file("${moduleAndSourceSet[0]}/build/classes/java/${sourceSet}")
            File reports = file("${moduleAndSourceSet[0]}/build/test-results/${sourceSet}")
            def compiled = classes.exists()
                    ? fileTree(dir: classes, include: '**/*Test.class').files
                            .findAll { !it.name.contains('$') }
                            .collect {
                                def path = classes.toPath().relativize(it.toPath()).toString()
                                path.substring(0, path.length() - '.class'.length())
                                        .replace(File.separatorChar, '.' as char)
                            } as Set
                    : [] as Set
            def reported = reports.exists()
                    ? fileTree(dir: reports, include: 'TEST-*.xml').files
                            .collect { it.name.substring('TEST-'.length(), it.name.length() - '.xml'.length()) } as Set
                    : [] as Set
            def unrun = (compiled - reported).sort()
            if (!unrun.isEmpty()) unrunTests[suite] = unrun
        }
        def missing = execFiles.findAll { !it.exists() }
        def stale = execFiles.findAll { exec ->
            exec.exists() && exec.lastModified() < sourcesChangedAt(moduleOf(exec))
        }
        if (!missing.isEmpty() || !stale.isEmpty() || !unrunTests.isEmpty()) {
            def details = (missing.collect { "no data in ${relative(it)}" } +
                    stale.collect { "${relative(it)} is older than the ${moduleOf(it)} sources" } +
                    unrunTests.collect { suite, unrun ->
                        "${suite} has no report for ${unrun.size()} of its test classes " +
                                "(${unrun.take(3).join(', ')}${unrun.size() > 3 ? ', ...' : ''})"
                    }).join('; ')
            throw new GradleException("Coverage data cannot be trusted (${details}). Measure this " +
                    'tree with "xvfb-run -a ./gradlew fullTest coverageReport --rerun-tasks".')
        }
    }
}

tasks.register('coverageReport', JacocoReport) {
    group = 'verification'
    description = 'Coverage report for the server and the desktop modules.'
    dependsOn coverageDataCheck, ':server:test', ':server:integrationTest', ':desktop-shared:test'
    // The desktop modules' exec data comes from their own suites, which are not dependencies of this
    // report; naming them keeps "./gradlew fullTest coverageReport" valid instead of failing with an
    // implicit-dependency error.
    mustRunAfter ':desktop-user:test', ':desktop-admin:test',
            ':desktop-user:fxTest', ':desktop-admin:fxTest'
    executionData existingCoverageExecutionData()
    classDirectories.setFrom files(coverageClassDirectories)
    sourceDirectories.setFrom files(coverageSourceDirectories)
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

// Anti-regression gate over the product modules. The floors are the baseline measured on
// 2026-11-14 across all four product modules and both desktop suites (bundle 81.35% line /
// 57.51% branch, from the aggregate coverageReport the BUNDLE rule reads), rounded down so a
// small refactor cannot fail the build on a fraction of a point. Both bundle floors keep about a
// point and a half of headroom, like the package floors below.
// Raise them as the remaining workflows gain tests.
def coverageVerification = tasks.register('coverageVerification', JacocoCoverageVerification) {
    group = 'verification'
    description = 'Fails when the product modules drop below their recorded coverage baseline.'
    dependsOn coverageDataCheck, ':server:test', ':server:integrationTest', ':desktop-shared:test'
    // The desktop suites produce the exec data this gate reads; when both are in the task graph
    // (fullTest) they have to finish first.
    mustRunAfter ':desktop-user:fxTest', ':desktop-admin:fxTest'
    executionData existingCoverageExecutionData()
    classDirectories.setFrom files(coverageClassDirectories)
    violationRules {
        rule {
            element = 'BUNDLE'
            limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.78 }
            limit { counter = 'BRANCH'; value = 'COVEREDRATIO'; minimum = 0.54 }
        }
        [
                'com.nexus.server.identity'             : [0.69d, 0.50d],
                'com.nexus.server.social'               : [0.64d, 0.38d],
                'com.nexus.server.messaging'            : [0.82d, 0.61d],
                'com.nexus.server.groups'               : [0.85d, 0.66d],
                'com.nexus.server.administration'       : [0.80d, 0.53d],
                'com.nexus.desktop.shared.mls'          : [0.85d, 0.54d],
                'com.nexus.desktop.shared.cache'        : [0.88d, 0.57d],
                'com.nexus.desktop.shared.messaging'    : [0.63d, 0.45d],
                // Measured 2026-11-13: 70.36% of lines and 47.77% of branches.
                'com.nexus.desktop.user'                : [0.70d, 0.47d],
                'com.nexus.desktop.admin'               : [0.84d, 0.52d]
        ].each { packageName, floors ->
            rule {
                element = 'PACKAGE'
                includes = [packageName]
                limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = floors[0] }
                limit { counter = 'BRANCH'; value = 'COVEREDRATIO'; minimum = floors[1] }
            }
        }
        // The three classes every delivery path runs through, held on their own because a package
        // average absorbs them. Measured 2026-11-14: OutboxPublisher 98.39% line / 92.75% branch,
        // ShellController 48.56% / 38.26%, AdminAppContext 74.19% / 60.00%. ShellController's floor
        // is that low on purpose: it records where the FX shell stands, it does not bless it.
        [
                'com.nexus.server.messaging.OutboxPublisher' : [0.97d, 0.92d],
                'com.nexus.desktop.user.ShellController'     : [0.47d, 0.36d],
                'com.nexus.desktop.admin.AdminAppContext'    : [0.73d, 0.59d]
        ].each { className, floors ->
            rule {
                element = 'CLASS'
                includes = [className]
                limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = floors[0] }
                limit { counter = 'BRANCH'; value = 'COVEREDRATIO'; minimum = floors[1] }
            }
        }
    }
}

// GA-only policy. Gradle has no built-in "this must be a release" check, so the policy would
// otherwise be enforced by review alone: resolving a milestone or beta by accident is silent.
// This task resolves every classpath the modules use and fails on any pre-release version.
def preReleaseVersion = ~/(?i)(^|[.\-_])(alpha|beta|rc|cr|m\d+|ea|preview|snapshot|dev|canary|nightly|next)(?=[.\-_]|\d|$)/

def gaOnlyCheck = tasks.register('gaOnlyCheck') {
    group = 'verification'
    description = 'Fails when any resolved dependency is a pre-release build.'
    notCompatibleWithConfigurationCache('resolves the dependency graph at execution time')
    doLast {
        def classpathNames = ['runtimeClasspath', 'testRuntimeClasspath',
                              'integrationTestRuntimeClasspath', 'fxTestRuntimeClasspath']
        def violations = new TreeSet<String>()
        subprojects.each { subproject ->
            subproject.configurations
                    .findAll { it.canBeResolved && classpathNames.contains(it.name) }
                    .each { configuration ->
                        configuration.incoming.resolutionResult.allComponents.each { component ->
                            if (!(component.id instanceof ModuleComponentIdentifier)) {
                                return
                            }
                            def id = component.id
                            if (preReleaseVersion.matcher(id.version).find()) {
                                violations << "${subproject.path} ${configuration.name}: " +
                                        "${id.group}:${id.module}:${id.version}"
                            }
                        }
                    }
        }
        if (!violations.isEmpty()) {
            throw new GradleException('Pre-release dependencies are not allowed (GA-only policy):\n' +
                    violations.collect { "  - ${it}" }.join('\n') +
                    '\nReplace each with its newest GA release; see docs/ci-cd.md.')
        }
        logger.lifecycle('gaOnlyCheck: every resolved dependency is a GA release')
    }
}

tasks.named('check') {
    dependsOn gaOnlyCheck
}

tasks.register('fullTest') {
    group = 'verification'
    description = 'Runs every module suite plus the coverage gate.'
    dependsOn ':server:test', ':server:integrationTest', ':desktop-shared:test',
            ':desktop-user:test', ':desktop-admin:test',
            ':desktop-user:fxTest', ':desktop-admin:fxTest',
            coverageVerification
}

sonar {
    properties {
        property 'sonar.host.url', 'https://sonarcloud.io'
        property 'sonar.sourceEncoding', 'UTF-8'
        property 'sonar.projectKey', 'hoanhophuoc_nexus'
        property 'sonar.organization', 'hoanhophuoc'
        // Every module's own jacocoTestReport is picked up by the plugin and imported by that
        // module only; a single aggregate report listed for all modules made desktop-user and
        // desktop-admin warn that none of its files matched their sources.
        // The root project holds no code: without a binary path the scanner warns that
        // sonar.java.binaries is empty for it. The product binaries are the ones being analysed.
        property 'sonar.java.binaries', [project(':server'), project(':desktop-shared')].collect {
            it.layout.buildDirectory.dir('classes/java/main').get().asFile.absolutePath
        }.join(',')
        // sonar.sources, sonar.tests and sonar.java.test.binaries come from each module's source
        // sets. Listing them here as well made the scanner index the test sources twice and the
        // analysis failed with "can't be indexed twice" for server/src/test.
        // java:S2077 flags every SQL statement whose text is not a compile-time constant. The
        // admin repositories below still assemble their optional filters and ORDER BY, so their
        // statement text is built at runtime even though every value is a bound parameter. Social,
        // groups and messaging are converted to constant statements with a first-page sentinel or
        // named parameters and are no longer excluded; the rest stay excluded until each query gets
        // the same treatment, one plan test at a time (measurements and the recipe are in
        // docs/ci-cd.md).
        property 'sonar.issue.ignore.multicriteria', [
                's2077Administration'
        ].join(',')
        [
                's2077Administration': '**/server/administration/*.java'
        ].each { name, resource ->
            property "sonar.issue.ignore.multicriteria.${name}.ruleKey", 'java:S2077'
            property "sonar.issue.ignore.multicriteria.${name}.resourceKey", resource
        }
        property 'sonar.qualitygate.wait', 'true'
        property 'sonar.qualitygate.timeout', '300'
    }
}

tasks.named('sonar') {
    dependsOn tasks.named('coverageReport')
    dependsOn ':server:jacocoTestReport', ':desktop-shared:jacocoTestReport',
            ':desktop-user:jacocoTestReport', ':desktop-admin:jacocoTestReport'
}
