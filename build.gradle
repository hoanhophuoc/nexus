import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.testing.jacoco.tasks.JacocoCoverageVerification

plugins {
    id 'java'
    id 'jacoco'
    id 'org.sonarqube' version '7.5.0.8588'
    id 'org.cyclonedx.bom' version '3.5.1'
}

group = 'system'
// Release builds pass -PreleaseVersion (or RELEASE_VERSION) from the git tag.
version = providers.gradleProperty('releaseVersion')
        .orElse(providers.environmentVariable('RELEASE_VERSION'))
        .getOrElse('1.0-SNAPSHOT')

repositories {
    mavenCentral()
}

// This project holds no product code: the Spring Boot server and the two JavaFX apps are
// the modules in settings.gradle. The root build owns only the aggregate verification
// task, the coverage gate, and the Sonar/SBOM configuration.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 27
}

jacoco {
    toolVersion = '0.8.16'
}

// Coverage for the modules that carry the product. The legacy monolith that used to be
// this project's own source set is gone, so the gate has to name the modules it measures.
def coverageModules = [':server', ':desktop-shared']

def coverageClassDirectories = { -> coverageModules.collect { project(it).sourceSets.main.output } }
def coverageSourceDirectories = { -> coverageModules.collect { project(it).sourceSets.main.allSource.srcDirs } }
def coverageExecutionData = { ->
    coverageModules.collect { project(it).layout.buildDirectory.file('jacoco/test.exec').get().asFile } +
            [project(':server').layout.buildDirectory.file('jacoco/integrationTest.exec').get().asFile]
}

tasks.register('coverageReport', JacocoReport) {
    group = 'verification'
    description = 'Coverage report for the server and desktop-shared modules.'
    dependsOn ':server:test', ':server:integrationTest', ':desktop-shared:test'
    executionData files(coverageExecutionData)
    classDirectories.setFrom files(coverageClassDirectories)
    sourceDirectories.setFrom files(coverageSourceDirectories)
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

// Anti-regression gate over the product modules. The floors are the baseline measured on
// 2026-11-11 (bundle 74.97% line / 52.32% branch), rounded down, so a regression fails the
// build instead of demanding coverage the current tests do not have. Raise them as the
// remaining workflows gain tests; the aspirational targets are documented in docs/CI-CD.md.
def coverageVerification = tasks.register('coverageVerification', JacocoCoverageVerification) {
    group = 'verification'
    description = 'Fails when the product modules drop below their recorded coverage baseline.'
    dependsOn ':server:test', ':server:integrationTest', ':desktop-shared:test'
    executionData files(coverageExecutionData)
    classDirectories.setFrom files(coverageClassDirectories)
    violationRules {
        rule {
            element = 'BUNDLE'
            limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.74 }
            limit { counter = 'BRANCH'; value = 'COVEREDRATIO'; minimum = 0.51 }
        }
        [
                'com.haichutieu.chatsystem.server.identity'             : [0.69d, 0.50d],
                'com.haichutieu.chatsystem.server.social'               : [0.64d, 0.38d],
                'com.haichutieu.chatsystem.server.messaging'            : [0.82d, 0.61d],
                'com.haichutieu.chatsystem.server.groups'               : [0.85d, 0.66d],
                'com.haichutieu.chatsystem.server.administration'       : [0.80d, 0.53d],
                'com.haichutieu.chatsystem.desktop.shared.mls'          : [0.85d, 0.54d],
                'com.haichutieu.chatsystem.desktop.shared.cache'        : [0.88d, 0.57d],
                'com.haichutieu.chatsystem.desktop.shared.messaging'    : [0.63d, 0.45d]
        ].each { packageName, floors ->
            rule {
                element = 'PACKAGE'
                includes = [packageName]
                limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = floors[0] }
                limit { counter = 'BRANCH'; value = 'COVEREDRATIO'; minimum = floors[1] }
            }
        }
    }
}

// GA-only policy. Gradle has no built-in "this must be a release" check, so the policy would
// otherwise be enforced by review alone: resolving a milestone or beta by accident is silent.
// This task resolves every classpath the modules use and fails on any pre-release version.
def preReleaseVersion = ~/(?i)(^|[.\-_])(alpha|beta|rc|cr|m\d+|ea|preview|snapshot|dev|canary|nightly|next)(?=[.\-_]|\d|$)/

def gaOnlyCheck = tasks.register('gaOnlyCheck') {
    group = 'verification'
    description = 'Fails when any resolved dependency is a pre-release build.'
    notCompatibleWithConfigurationCache('resolves the dependency graph at execution time')
    doLast {
        def classpathNames = ['runtimeClasspath', 'testRuntimeClasspath',
                              'integrationTestRuntimeClasspath', 'fxTestRuntimeClasspath']
        def violations = new TreeSet<String>()
        subprojects.each { subproject ->
            subproject.configurations
                    .findAll { it.canBeResolved && classpathNames.contains(it.name) }
                    .each { configuration ->
                        configuration.incoming.resolutionResult.allComponents.each { component ->
                            if (!(component.id instanceof ModuleComponentIdentifier)) {
                                return
                            }
                            def id = component.id
                            if (preReleaseVersion.matcher(id.version).find()) {
                                violations << "${subproject.path} ${configuration.name}: " +
                                        "${id.group}:${id.module}:${id.version}"
                            }
                        }
                    }
        }
        if (!violations.isEmpty()) {
            throw new GradleException('Pre-release dependencies are not allowed (GA-only policy):\n' +
                    violations.collect { "  - ${it}" }.join('\n') +
                    '\nReplace each with its newest GA release; see docs/plan.md.')
        }
        logger.lifecycle('gaOnlyCheck: every resolved dependency is a GA release')
    }
}

tasks.named('check') {
    dependsOn gaOnlyCheck
}

tasks.register('fullTest') {
    group = 'verification'
    description = 'Runs every module suite plus the coverage gate.'
    dependsOn ':server:test', ':server:integrationTest', ':desktop-shared:test',
            ':desktop-user:test', ':desktop-admin:test',
            ':desktop-user:fxTest', ':desktop-admin:fxTest',
            coverageVerification
}

sonar {
    properties {
        property 'sonar.host.url', 'https://sonarcloud.io'
        property 'sonar.sourceEncoding', 'UTF-8'
        property 'sonar.projectKey', 'hoanhophuoc_Chat-System'
        property 'sonar.organization', 'hoanhophuoc'
        property 'sonar.coverage.jacoco.xmlReportPaths',
                layout.buildDirectory.file('reports/jacoco/coverageReport/coverageReport.xml').get().asFile.absolutePath
        property 'sonar.tests',
                'server/src/test/java,server/src/integrationTest/java,' +
                        'desktop-shared/src/test/java,' +
                        'desktop-user/src/test/java,desktop-user/src/fxTest/java,' +
                        'desktop-admin/src/test/java,desktop-admin/src/fxTest/java'
        property 'sonar.java.test.binaries',
                'server/build/classes/java/test,server/build/classes/java/integrationTest,' +
                        'desktop-shared/build/classes/java/test,' +
                        'desktop-user/build/classes/java/test,desktop-user/build/classes/java/fxTest,' +
                        'desktop-admin/build/classes/java/test,desktop-admin/build/classes/java/fxTest'
        property 'sonar.qualitygate.wait', 'true'
        property 'sonar.qualitygate.timeout', '300'
    }
}

tasks.named('sonar') {
    dependsOn tasks.named('coverageReport')
}
