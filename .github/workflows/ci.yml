name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      shell_repeat:
        description: Passes of the ShellStateFxTest state table
        required: false
        type: number
        default: 600

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, unit & integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # SonarQube measures the two desktop modules from the JavaFX coverage data this job produces.
    needs: fx-test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 27
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '27'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true

      # The release policy is GA only: a pre-release action pin, image tag or dependency fails here.
      - name: Enforce GA-only versions
        run: |
          set -euo pipefail
          ./scripts/check-ga-pins.sh
          ./gradlew --no-daemon gaOnlyCheck

      - name: Enforce pinned container images
        run: ./scripts/check-image-pins.sh

      # The root project holds no code, so every suite belongs to a module.
      - name: Compile, unit tests and integration tests
        run: >
          ./gradlew --no-daemon clean
          :server:test :server:integrationTest
          :desktop-shared:test :desktop-user:test :desktop-admin:test

      # The desktop modules are measured by their JavaFX suites; their exec data comes from the
      # fx-test job, so the toolkit is not run a second time here. The coverage report and the
      # floor need it before either runs.
      - name: Download JavaFX coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fx-coverage
          path: .

      - name: Generate JaCoCo coverage report
        run: ./gradlew --no-daemon coverageReport

      - name: Enforce coverage regression floor
        run: ./gradlew --no-daemon coverageVerification

      - name: Detect Sonar token
        id: sonar-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SONAR_TOKEN is not configured; SonarQube Cloud analysis is skipped."
          fi

      # Forked pull requests never receive this secret. Analysis waits for the
      # project quality gate and fails this job when the gate fails.
      - name: SonarQube Cloud analysis and quality gate
        if: steps.sonar-token.outputs.present == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew --no-daemon sonar

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            */build/reports/tests
            */build/test-results
            build/reports/jacoco
          retention-days: 14

  fx-test:
    name: JavaFX FXML tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 27
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '27'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      # Xvfb's own default screen is 640x480, smaller than the 1184x784 scenes the goldens capture,
      # so the display is pinned at a size no baseline can outgrow.
      - name: Run JavaFX tests
        env:
          GOLDEN_BASELINE: ci
        run: >
          xvfb-run -a -s "-screen 0 1280x1024x24"
          ./gradlew --no-daemon :desktop-user:fxTest :desktop-admin:fxTest

      # The proof of concept is a check, not a demo: a theme, popup, icon-font or preference
      # regression fails here instead of leaving a screenshot nobody asserts on.
      - name: Verify the AtlantaFX and Ikonli proof of concept
        run: >
          xvfb-run -a -s "-screen 0 1280x1024x24"
          ./gradlew --no-daemon :ui-spike:spikeCheck

      - name: Upload proof-of-concept screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-spike
          path: ui-spike/build/ui-spike
          retention-days: 14

      - name: Upload JavaFX coverage data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fx-coverage
          path: |
            desktop-user/build/jacoco/fxTest.exec
            desktop-admin/build/jacoco/fxTest.exec
          retention-days: 14

      - name: Upload JavaFX reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fx-test-reports
          path: |
            desktop-user/build/reports/tests/fxTest
            desktop-user/build/test-results/fxTest
            desktop-admin/build/reports/tests/fxTest
            desktop-admin/build/test-results/fxTest
            desktop-admin/build/golden-actual
            desktop-user/build/golden-actual
          retention-days: 14

  # On demand only: the normal suites run each state table once, and a race that needs a particular
  # interleaving only shows up when the same table runs hundreds of times in one JVM. Kept out of
  # pushes and pull requests because it costs tens of minutes; start it from the Actions tab or
  # `gh workflow run ci.yml -f shell_repeat=600` when `ShellStateFxTest` has failed somewhere.
  shell-stress:
    name: Shell-state stress (on demand)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A push cancels an in-progress run of this workflow; a stress run lasts tens of minutes, so it
    # gets its own group and is never cancelled by one.
    concurrency:
      group: shell-stress-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 27
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '27'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      # The repeating test is opt-in through this property, so the single pass that the main
      # fx-test job runs keeps its 60 second budget either way.
      - name: Repeat the shell-state table
        env:
          JAVA_TOOL_OPTIONS: -Dnexus.shellTable.repeat=${{ inputs.shell_repeat }}
        run: >
          xvfb-run -a -s "-screen 0 1280x1024x24"
          ./gradlew --no-daemon :desktop-user:fxTest --tests '*ShellStateFxTest' --rerun

      # A failure names the iteration and the step that did not settle, and carries the shell
      # diagnostics and FX-thread responsiveness: those only survive if the report is kept.
      - name: Upload shell-state stress reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shell-stress-reports
          path: |
            desktop-user/build/test-results/fxTest
            desktop-user/build/reports/tests/fxTest
          retention-days: 14

  database-identity:
    name: Database identity pre-flight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every documented branch of the pre-flight check, including the rejected password and the
      # unreachable host that used to be reported as a fresh install.
      - name: Exercise check-database-identity.sh
        run: ./scripts/test-database-identity.sh

  live-journey:
    name: Live user journey (isolated Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner needs only Docker. It provisions PostgreSQL, Redis, the
      # server, generated admin credentials and a headless JavaFX environment.
      - name: Run isolated live user journey
        run: ./scripts/live-journey.sh

      - name: Upload live journey reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-journey-reports
          path: |
            desktop-user/build/reports/tests/fxTest
            desktop-user/build/test-results/fxTest
          retention-days: 14

      - name: Verify temporary Docker resources were removed
        if: always()
        run: |
          set -euo pipefail
          leftovers="$(
            {
              docker ps -a --format '{{.Names}}' | grep '^nexus-live-' || true
              docker network ls --format '{{.Name}}' | grep '^nexus-live-' || true
              docker volume ls --format '{{.Name}}' | grep '^nexus-live-' || true
            } | sort -u
          )"
          if [ -n "$leftovers" ]; then
            echo "::error::Temporary live-journey Docker resources were not removed:"
            echo "$leftovers"
            exit 1
          fi

  package-linux:
    name: Linux app image
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 27
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '27'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true

      # JavaFX needs a display and its GTK stack; the images are launched, not just inspected.
      - name: Install headless display packages
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          xvfb libgtk-3-0 libxtst6 libxrender1 libxi6 libx11-6 libglib2.0-0

      # Packages the rewritten desktop modules, not the legacy root launchers.
      - name: Build client and admin application images
        run: >
          ./gradlew --no-daemon :desktop-user:packageClient :desktop-admin:packageAdmin
          -PpackageType=app-image -PappVersion=0.0.0

      # A jar that never reached the image is invisible to a file listing but kills the first
      # window, so each launcher has to stay open instead of exiting.
      - name: Verify the application images launch
        run: |
          set -euo pipefail
          ./scripts/verify-app-image.sh \
            --image desktop-user/build/package/nexusClient/out/nexusClient --launch
          ./scripts/verify-app-image.sh \
            --image desktop-admin/build/package/nexusAdmin/out/nexusAdmin --launch

      - name: Archive application images
        run: |
          set -euo pipefail
          mkdir -p build/app-images
          cp -R desktop-user/build/package/nexusClient/out/nexusClient build/app-images/
          cp -R desktop-admin/build/package/nexusAdmin/out/nexusAdmin build/app-images/
          tar -czf build/nexus-linux-x64-appimages.tar.gz -C build/app-images .

      - name: Upload application images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-app-images
          path: build/nexus-linux-x64-appimages.tar.gz
          retention-days: 14
