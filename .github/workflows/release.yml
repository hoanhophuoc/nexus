name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate semantic version tag on main
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG is not a semantic version (vMAJOR.MINOR.PATCH)."
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit is not on main."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 27
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '27'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true
          cache-disabled: true

      - name: Unit and integration tests
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          ./gradlew --no-daemon
          :server:test :server:integrationTest
          :desktop-shared:test :desktop-user:test :desktop-admin:test
          -PreleaseVersion="$VERSION"

  sbom:
    name: CycloneDX SBOM
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 27
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '27'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true
          cache-disabled: true

      - name: Generate SBOM
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: ./gradlew --no-daemon cyclonedxBom -PreleaseVersion="$VERSION"

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: build/reports/cyclonedx/bom.json
          if-no-files-found: error
          retention-days: 30

  package:
    name: Package ${{ matrix.artifact }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package_type: deb
            artifact: linux-x64
          - os: windows-latest
            package_type: msi
            artifact: windows-x64
          # macos-26 is the arm64 runner: GitHub retired every macOS 14 label on 2026-11-02, which
          # cancelled this job instantly and left the publish step permanently skipped.
          - os: macos-26
            package_type: dmg
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 27
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '27'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true
          cache-disabled: true

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot

      - name: Build native installers
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PACKAGE_TYPE: ${{ matrix.package_type }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :desktop-user:packageClient :desktop-admin:packageAdmin \
            -PpackageType="$PACKAGE_TYPE" \
            -PreleaseVersion="$VERSION" \
            -PappVersion="$VERSION"

      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find desktop-user/build/package desktop-admin/build/package \
            -path '*/out/*' -type f \( -name '*.deb' -o -name '*.msi' -o -name '*.dmg' \) \
            -exec cp {} release-assets/ \;
          test -n "$(ls -A release-assets)"
          ls -l release-assets

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: release-assets
          if-no-files-found: error
          retention-days: 30

  server-image:
    name: Server Docker image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Build and push versioned server image
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/$owner/nexus-server:$VERSION"
          docker build -t "$image" .
          # GHCR occasionally answers the manifest write with a bare "denied" after accepting every
          # layer, which failed v1.0.0 and passed unchanged on the retry. Pushing again is safe:
          # layers are content-addressed, the registry skips the ones it already holds, and the tag
          # only appears once the manifest lands.
          for attempt in 1 2 3; do
            if docker push "$image"; then
              echo "Pushed \`$image\` on attempt $attempt" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::Push attempt $attempt of 3 failed for $image"
            sleep $((attempt * 15))
          done
          echo "::error::Could not push $image after 3 attempts."
          exit 1

  publish:
    name: Publish GitHub release
    needs: [validate, package, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'release-assets/*'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          # This job never checks out the repository, so gh cannot discover it from a git remote.
          repo=(--repo "$GITHUB_REPOSITORY")
          if ! gh release create "$GITHUB_REF_NAME" release-assets/* "${repo[@]}" \
            --title "Nexus $VERSION" \
            --generate-notes; then
            # A second attempt must still deliver the assets, so treat an existing release as a
            # reason to replace its assets rather than to fail the release.
            echo "::warning::Release $GITHUB_REF_NAME already exists; uploading its assets."
            gh release upload "$GITHUB_REF_NAME" release-assets/* "${repo[@]}" --clobber
          fi
