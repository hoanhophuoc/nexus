plugins {
    id 'jacoco'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.nexus'
version = rootProject.version

java { toolchain { languageVersion = JavaLanguageVersion.of(27) } }

repositories { mavenCentral() }

javafx {
    version = '27.0.1'
    modules = ['javafx.controls', 'javafx.fxml']
}

application {
    mainClass = 'com.nexus.desktop.admin.AdminDesktopApplication'
    applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics']
}

sourceSets {
    fxTest {
        java.srcDir 'src/fxTest/java'
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    fxTestImplementation.extendsFrom testImplementation
    fxTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation project(':desktop-shared')
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
    testImplementation 'org.assertj:assertj-core:3.27.7'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 27
}

tasks.withType(Test).configureEach { useJUnitPlatform() }

tasks.register('fxTest', Test) {
    description = 'Runs JavaFX toolkit/UI tests (requires a display or Xvfb).'
    group = 'verification'
    testClassesDirs = sourceSets.fxTest.output.classesDirs
    classpath = sourceSets.fxTest.runtimeClasspath
    systemProperty 'junit.jupiter.execution.timeout.default', '60 s'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

// Native desktop package. Run it on the target OS; jpackage never cross-compiles.
//   ./gradlew :desktop-admin:packageAdmin -PpackageType=app-image
//   ./gradlew :desktop-admin:packageAdmin -PpackageType=deb
def packageType = providers.gradleProperty('packageType').getOrElse('app-image')
def packageVersion = providers.gradleProperty('appVersion').getOrElse('1.0.0')

tasks.register('packageAdmin', Exec) {
    group = 'distribution'
    description = 'Builds the admin client with jpackage (app-image, deb, msi or dmg).'
    dependsOn tasks.named('jar')
    def inputDir = layout.buildDirectory.dir('package/nexusAdmin/input')
    def destDir = layout.buildDirectory.dir('package/nexusAdmin/out')
    doFirst {
        delete inputDir.get().asFile, destDir.get().asFile
        copy {
            from configurations.runtimeClasspath
            from tasks.named('jar').get().archiveFile
            into inputDir
        }
        commandLine 'jpackage',
                '--type', packageType,
                '--name', 'nexusAdmin',
                '--app-version', packageVersion,
                '--vendor', 'Chat System',
                '--input', inputDir.get().asFile.absolutePath,
                '--main-jar', tasks.named('jar').get().archiveFileName.get(),
                '--main-class', 'com.nexus.desktop.admin.AdminDesktopApplication',
                '--dest', destDir.get().asFile.absolutePath,
                '--java-options', '-Dfile.encoding=UTF-8',
                // JavaFX loads as an unnamed module here, so the named-module form of this
                // flag would leave native access blocked.
                '--java-options', '--enable-native-access=ALL-UNNAMED'
    }
}

// SonarQube imports this module's own report; without it the module inherited the root aggregate
// report and logged that none of its files could be matched.
tasks.named('jacocoTestReport') {
    // The unit test suite of this module is tiny; the JavaFX suite is where its coverage comes
    // from. Its exec file arrives as an artifact from the fx-test CI job, so the report picks it
    // up when it is present and still works for a unit-test-only run.
    dependsOn tasks.named('test')
    def fxTestExec = layout.buildDirectory.file('jacoco/fxTest.exec')
    executionData files(provider {
        def unitExec = layout.buildDirectory.file('jacoco/test.exec').get().asFile
        def fxExec = fxTestExec.get().asFile
        fxExec.exists() ? [unitExec, fxExec] : [unitExec]
    })
    reports {
        xml.required = true
        html.required = false
        csv.required = false
    }
}
