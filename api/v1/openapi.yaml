openapi: 3.0.3
info:
  title: Chat System API
  version: 1.0.0
servers:
  - url: /api/v1
security:
  - session: []
paths:
  /auth/csrf:
    get:
      operationId: getCsrfToken
      security: []
      responses:
        '200':
          description: Send token in the X-XSRF-TOKEN header for unsafe requests; also sets the XSRF-TOKEN cookie
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string }
  /auth/register:
    post:
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Registration' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Login' }
      responses:
        '200':
          description: Authenticated session
          headers:
            Set-Cookie:
              description: HttpOnly Secure SameSite=Strict CHAT_SESSION cookie; the opaque token is never returned in the JSON body.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/logout:
    post:
      operationId: logout
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password:
    put:
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, minLength: 1, writeOnly: true }
                newPassword: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
      responses:
        '204': { description: Password changed and other sessions revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password-reset:
    post:
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202': { description: Request accepted regardless of account existence }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, newPassword]
              properties:
                token: { type: string, minLength: 32, maxLength: 128 }
                newPassword: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
      responses:
        '204': { description: Password reset and token consumed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /users/me:
    get:
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user's own profile, including email
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users:
    get:
      operationId: searchUsers
      parameters:
        - { name: query, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Visible users matching username or name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /friend-requests:
    get:
      operationId: listFriendRequests
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Requests addressed to the authenticated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendRequestPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: sendFriendRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string, format: uuid }
      responses:
        '201': { description: Request created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /friend-requests/{requestId}:
    parameters:
      - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: decideFriendRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [accept, decline] }
      responses:
        '204': { description: Request handled }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: cancelFriendRequest
      responses:
        '204': { description: Outgoing request cancelled }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /friend-requests/outgoing:
    get:
      operationId: listOutgoingFriendRequests
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Requests sent by the authenticated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutgoingFriendRequestPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /friends:
    get:
      operationId: listFriends
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Friend list with current presence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /friends/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: removeFriend
      responses:
        '204': { description: Friendship removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/me/key-package:
    put:
      operationId: publishKeyPackage
      description: Publishes the caller's current signed public key package for group invitations.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 65536 }
      responses:
        '204': { description: Public key package replaced }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: Key package exceeds the payload limit }
  /users/{userId}/key-package:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getKeyPackage
      description: Returns a user's signed public key package for group invitation.
      responses:
        '200':
          description: Opaque signed public key package
          content:
            application/octet-stream:
              schema: { type: string, format: binary, maxLength: 65536 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /blocks/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: blockUser
      responses:
        '204': { description: User blocked and friendship removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: unblockUser
      responses:
        '204': { description: User unblocked; friendship is not recreated }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /blocks:
    get:
      operationId: listBlockedUsers
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Users blocked by the authenticated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /reports:
    post:
      operationId: reportUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportSubmission' }
      responses:
        '201': { description: Report submitted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /conversations:
    get:
      operationId: listConversations
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Conversations visible to the authenticated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createDirectConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [participantId]
              properties:
                participantId: { type: string, format: uuid }
      responses:
        '201':
          description: Direct conversation created or existing eligible conversation returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Conversation is not allowed due to relationship state }
  /groups:
    get:
      operationId: listGroups
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Groups visible to the authenticated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGroup' }
      responses:
        '201':
          description: Group created; creator is an admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /groups/{groupId}:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: renameGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '204': { description: Group renamed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller is not a group admin }
        '404': { $ref: '#/components/responses/NotFound' }
  /groups/{groupId}/members:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listGroupMembers
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Group members and their roles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupMemberPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: addGroupMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userId]
              properties:
                userId: { type: string, format: uuid }
                keyPackage: { type: string, format: byte, maxLength: 65536 }
      responses:
        '201': { description: Member added; the next MLS commit must add their key package }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller is not a group admin }
        '404': { $ref: '#/components/responses/NotFound' }
  /groups/{groupId}/members/{userId}:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: removeGroupMember
      responses:
        '204': { description: Member removed; members must commit the new MLS epoch }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller is neither an admin nor the member leaving }
        '404': { $ref: '#/components/responses/NotFound' }
  /groups/{groupId}/members/{userId}/role:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setGroupMemberRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { type: string, enum: [admin, member] }
      responses:
        '204': { description: Member role changed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller is not a group admin }
        '404': { $ref: '#/components/responses/NotFound' }
  /groups/{groupId}/mls-commits:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: submitMlsCommit
      description: Persists an opaque MLS commit at the next epoch with compare-and-set on X-MLS-Epoch.
      parameters:
        - name: X-MLS-Epoch
          in: header
          required: true
          description: Epoch the commit was built from; the commit lands at this epoch plus one.
          schema: { type: integer, format: int64, minimum: 0 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 1048576 }
      responses:
        '201': { description: Valid commit persisted at the next group epoch }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller is not an active group member }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Commit is stale, duplicate, or out of order' }
        '413': { description: MLS commit exceeds the payload limit }
  /groups/{groupId}/mls-messages:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getMlsMessages
      parameters:
        - name: after
          in: query
          description: Opaque cursor; the ID of the last MLS message already received.
          schema: { type: string }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: MLS messages and commits visible from the caller's membership epoch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MlsMessagePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: sendMlsApplicationMessage
      parameters:
        - name: X-MLS-Epoch
          in: header
          required: true
          description: Epoch the ciphertext was encrypted for; must equal the current group epoch.
          schema: { type: integer, format: int64, minimum: 0 }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 65536 }
      responses:
        '201':
          description: Ciphertext persisted and queued for fan-out; retries with the same key return the stored message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MlsMessage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller is not an active group member }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: MLS epoch is stale or the idempotency key was reused' }
        '413': { description: Ciphertext exceeds the payload limit }
  /groups/{groupId}/recovery-package:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: storeEncryptedRecoveryPackage
      description: Stores only client-encrypted state; the server never receives the recovery code or keys.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 1048576 }
      responses:
        '204': { description: Client-encrypted recovery package replaced }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Recovery package exceeds the payload limit }
    get:
      operationId: getEncryptedRecoveryPackage
      description: Returns the caller's own encrypted recovery package; a recovery code is required to decrypt it.
      responses:
        '200':
          description: Opaque client-encrypted recovery package
          content:
            application/octet-stream:
              schema: { type: string, format: binary, maxLength: 1048576 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/users:
    get:
      operationId: adminListUsers
      description: Requires an authenticated admin session.
      parameters:
        - { name: query, in: query, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [active, locked] } }
        - { name: sort, in: query, schema: { type: string, enum: [name, createdAt], default: createdAt } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Paged account records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin role required }
    post:
      operationId: adminCreateUser
      description: Requires an authenticated admin session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Registration' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin role required }
  /admin/users/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: adminGetUser
      description: Requires an authenticated admin session.
      responses:
        '200':
          description: Account profile without secrets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin role required }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: adminUpdateUser
      description: Requires an authenticated admin session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200': { description: Account updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin role required }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: adminDeleteUser
      description: Requires an authenticated admin session. Action is audited.
      responses:
        '204': { description: Account deleted and action audited }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin role required }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/users/{userId}/lock:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: adminSetUserLock
      description: Requires an authenticated admin session. Action is audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [locked, reason]
              properties:
                locked: { type: boolean }
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '204': { description: Lock state changed; action audited }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin role required }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/users/{userId}/password-reset:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: adminRequestPasswordReset
      description: Requires an authenticated admin session. Sends a single-use reset link and audits the action.
      responses:
        '202': { description: Reset request accepted and action audited }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin role required }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/users/{userId}/login-history:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: adminGetUserLoginHistory
      description: Requires an authenticated admin session.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Login times in UTC
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginHistoryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin role required }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/login-history:
    get:
      operationId: adminListLoginHistory
      description: Requires an authenticated admin session.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Login events ordered by UTC time
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginHistoryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin role required }
  /admin/users/{userId}/friends:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: adminListUserFriends
      description: Requires an authenticated admin session.
      responses:
        '200':
          description: User friend list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin role required }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/groups:
    get:
      operationId: adminListGroups
      description: Requires an authenticated admin session.
      parameters:
        - { name: query, in: query, schema: { type: string, maxLength: 100 } }
        - { name: sort, in: query, schema: { type: string, enum: [name, createdAt], default: createdAt } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Paged group records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin role required }
  /admin/groups/{groupId}/members:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: adminListGroupMembers
      description: Requires an authenticated admin session.
      responses:
        '200':
          description: Group member and admin assignments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupMemberPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin role required }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/reports:
    get:
      operationId: adminListReports
      description: Requires an authenticated admin session. Message access is limited to evidence explicitly submitted by the reporter.
      parameters:
        - { name: reportedUsername, in: query, schema: { type: string, maxLength: 32 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: sort, in: query, schema: { type: string, enum: [createdAt, reportedUsername], default: createdAt } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Paged report metadata and reporter-submitted evidence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin role required }
  /admin/reports/{reportId}/decision:
    parameters:
      - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: adminDecideReport
      description: Requires an authenticated admin session. Decision and any lock action are audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, lockReportedUser]
              properties:
                decision: { type: string, enum: [uphold, dismiss] }
                lockReportedUser: { type: boolean }
                note: { type: string, maxLength: 1000 }
      responses:
        '204': { description: Report decision recorded and audited }
        '409': { description: Report was already decided }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin role required }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/registrations:
    get:
      operationId: adminListRegistrations
      description: Requires an authenticated admin session.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: query, in: query, schema: { type: string, maxLength: 100 } }
        - { name: sort, in: query, schema: { type: string, enum: [name, createdAt], default: createdAt } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Registrations in the UTC instant interval [from, to)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin role required }
  /admin/analytics/friends:
    get:
      operationId: adminGetFriendAnalytics
      description: Requires an authenticated admin session.
      parameters:
        - { name: query, in: query, schema: { type: string, maxLength: 100 } }
        - { name: directFriendCount, in: query, schema: { type: integer, minimum: 0 } }
        - { name: directFriendCountComparison, in: query, schema: { type: string, enum: [eq, lt, gt] } }
        - { name: sort, in: query, schema: { type: string, enum: [name, createdAt], default: name } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Direct and friend-of-friend counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendAnalyticsPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin role required }
  /admin/analytics/activity:
    get:
      operationId: adminGetActivityAnalytics
      description: Requires an authenticated admin session.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: query, in: query, schema: { type: string, maxLength: 100 } }
        - name: activityCount
          in: query
          description: Filters on app opens plus distinct direct people plus distinct groups in the range.
          schema: { type: integer, minimum: 0 }
        - { name: activityCountComparison, in: query, schema: { type: string, enum: [eq, lt, gt] } }
        - { name: sort, in: query, schema: { type: string, enum: [name, createdAt], default: name } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: App opens and distinct direct and group conversations in the UTC instant interval [from, to)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityAnalyticsPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin role required }
  /admin/analytics/registrations/monthly:
    get:
      operationId: adminGetMonthlyRegistrations
      description: Requires an authenticated admin session.
      parameters:
        - { name: year, in: query, required: true, schema: { type: integer, minimum: 2000, maximum: 9999 } }
      responses:
        '200':
          description: Twelve calendar-month buckets; months without registrations have count zero
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthlyCounts' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin role required }
  /admin/analytics/app-opens/monthly:
    get:
      operationId: adminGetMonthlyAppOpens
      description: Requires an authenticated admin session.
      parameters:
        - { name: year, in: query, required: true, schema: { type: integer, minimum: 2000, maximum: 9999 } }
      responses:
        '200':
          description: Twelve calendar-month buckets of distinct users who opened the app; empty months are zero
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthlyCounts' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin role required }
  /admin/audit-events:
    get:
      operationId: adminListAuditEvents
      description: Requires an authenticated admin session.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Paged administrative audit events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admin role required }
  /conversations/{conversationId}/messages:
    parameters:
      - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getMessages
      description: Direct-message history only; use the MLS group endpoints for group ciphertext.
      parameters:
        - { name: after, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Messages after the supplied opaque cursor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Conversation is a group; use the MLS endpoints }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: sendMessage
      description: Sends a direct message. Group messages use the MLS endpoints.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageSubmission' }
      responses:
        '201':
          description: Message persisted; safe to retry with the same idempotency key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Conversation is a group; use the MLS endpoints }
        '404': { $ref: '#/components/responses/NotFound' }
  /conversations/{conversationId}/messages/{messageId}:
    parameters:
      - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteMessage
      parameters:
        - { name: scope, in: query, required: true, schema: { type: string, enum: [me, everyone] } }
      responses:
        '204': { description: Message hidden for the caller or deleted for everyone by its sender }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Caller cannot delete this message for everyone }
        '404': { $ref: '#/components/responses/NotFound' }
  /conversations/{conversationId}/history:
    parameters:
      - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: clearConversationHistory
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: History cleared for the authenticated user only }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: CHAT_SESSION
      description: Opaque revocable session token; servers store only its hash. SameSite=Strict limits ambient cookie use.
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Request conflicts with current account or relationship state
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found or not visible to caller
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limit exceeded; Retry-After gives the retry delay in seconds
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Registration:
      type: object
      additionalProperties: false
      required: [username, fullName, email, address, birthDate, gender, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        fullName: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        address: { type: string, maxLength: 255 }
        birthDate: { type: string, format: date }
        gender: { type: string, enum: [female, male, other, undisclosed] }
        password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
    Login:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 32 }
        password: { type: string, minLength: 1, writeOnly: true }
    ProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        fullName: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        address: { type: string, maxLength: 255 }
        birthDate: { type: string, format: date }
        gender: { type: string, enum: [female, male, other, undisclosed] }
    User:
      type: object
      additionalProperties: false
      required: [id, username, fullName, presence]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        fullName: { type: string }
        address: { type: string }
        birthDate: { type: string, format: date }
        gender: { type: string, enum: [female, male, other, undisclosed] }
        presence: { type: string, enum: [online, offline] }
    MyProfile:
      type: object
      additionalProperties: false
      required: [id, username, fullName, email, presence]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        fullName: { type: string }
        email: { type: string, format: email }
        address: { type: string }
        birthDate: { type: string, format: date }
        gender: { type: string, enum: [female, male, other, undisclosed] }
        presence: { type: string, enum: [online, offline] }
    UserPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/User' } }
        nextCursor: { type: string, nullable: true }
    FriendRequestPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/FriendRequest' } }
        nextCursor: { type: string, nullable: true }
    FriendRequest:
      type: object
      required: [id, from]
      properties:
        id: { type: string, format: uuid }
        from: { $ref: '#/components/schemas/User' }
    OutgoingFriendRequest:
      type: object
      required: [id, to]
      properties:
        id: { type: string, format: uuid }
        to: { $ref: '#/components/schemas/User' }
    OutgoingFriendRequestPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OutgoingFriendRequest' } }
        nextCursor: { type: string, nullable: true }
    ReportSubmission:
      type: object
      additionalProperties: false
      required: [reportedUserId, reason, evidenceConsent]
      properties:
        reportedUserId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        evidenceConsent:
          type: boolean
          description: Must be true when selectedEvidence is supplied.
        selectedEvidence:
          type: array
          maxItems: 10
          items:
            type: object
            required: [messageId, submittedContent]
            properties:
              messageId: { type: string, format: uuid }
              submittedContent: { type: string, maxLength: 4000 }
    MessageSubmission:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 10000 }
    Message:
      type: object
      required: [id, conversationId, senderId, content, createdAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        senderId: { type: string, format: uuid }
        content: { type: string }
        createdAt: { type: string, format: date-time }
        deletedForEveryoneAt: { type: string, format: date-time, nullable: true }
    MessagePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Message' } }
        nextCursor: { type: string, nullable: true }
    Conversation:
      type: object
      required: [id, name, type, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, nullable: true }
        type: { type: string, enum: [direct, group] }
        createdAt: { type: string, format: date-time }
        members: { type: array, items: { $ref: '#/components/schemas/GroupMember' } }
    ConversationPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Conversation' } }
        nextCursor: { type: string, nullable: true }
    CreateGroup:
      type: object
      additionalProperties: false
      required: [name, invitedUserIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        invitedUserIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
        keyPackages:
          type: array
          items:
            type: object
            required: [userId, keyPackage]
            properties:
              userId: { type: string, format: uuid }
              keyPackage: { type: string, format: byte, maxLength: 65536 }
    GroupMember:
      type: object
      required: [user, role, joinedEpoch]
      properties:
        user: { $ref: '#/components/schemas/User' }
        role: { type: string, enum: [admin, member] }
        joinedEpoch: { type: integer, minimum: 0 }
    GroupMemberPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/GroupMember' } }
        nextCursor: { type: string, nullable: true }
    MlsMessage:
      type: object
      required: [id, epoch, kind, ciphertext, createdAt]
      properties:
        id: { type: string, format: uuid }
        epoch: { type: integer, minimum: 0 }
        kind: { type: string, enum: [commit, application] }
        ciphertext: { type: string, format: byte, maxLength: 1048576 }
        createdAt: { type: string, format: date-time }
    MlsMessagePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MlsMessage' } }
        nextCursor: { type: string, nullable: true }
    AdminUser:
      type: object
      required: [id, username, fullName, email, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        fullName: { type: string }
        email: { type: string, format: email }
        address: { type: string }
        birthDate: { type: string, format: date }
        gender: { type: string, enum: [female, male, other, undisclosed] }
        status: { type: string, enum: [active, locked] }
        createdAt: { type: string, format: date-time }
    AdminUserPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }
        nextCursor: { type: string, nullable: true }
    LoginHistoryEntry:
      type: object
      required: [userId, username, fullName, occurredAt]
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        fullName: { type: string }
        occurredAt: { type: string, format: date-time }
    LoginHistoryPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/LoginHistoryEntry' } }
        nextCursor: { type: string, nullable: true }
    Report:
      type: object
      required: [id, reporter, reportedUser, reason, createdAt, status, selectedEvidence]
      properties:
        id: { type: string, format: uuid }
        reporter: { $ref: '#/components/schemas/User' }
        reportedUser: { $ref: '#/components/schemas/User' }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        status: { type: string, enum: [pending, upheld, dismissed] }
        selectedEvidence:
          type: array
          description: Exact message excerpts submitted by the reporter with explicit consent.
          items:
            type: object
            required: [messageId, submittedContent]
            properties:
              messageId: { type: string, format: uuid }
              submittedContent: { type: string }
    ReportPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Report' } }
        nextCursor: { type: string, nullable: true }
    FriendAnalytics:
      type: object
      required: [user, directFriends, friendsOfFriends]
      properties:
        user: { $ref: '#/components/schemas/AdminUser' }
        directFriends: { type: integer, minimum: 0 }
        friendsOfFriends: { type: integer, minimum: 0 }
    FriendAnalyticsPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/FriendAnalytics' } }
        nextCursor: { type: string, nullable: true }
    ActivityAnalytics:
      type: object
      required: [user, appOpens, peopleChattedWith, groupsChattedWith]
      properties:
        user: { $ref: '#/components/schemas/AdminUser' }
        appOpens: { type: integer, minimum: 0 }
        peopleChattedWith: { type: integer, minimum: 0 }
        groupsChattedWith: { type: integer, minimum: 0 }
    ActivityAnalyticsPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ActivityAnalytics' } }
        nextCursor: { type: string, nullable: true }
    MonthlyCount:
      type: object
      required: [month, count]
      properties:
        month: { type: integer, minimum: 1, maximum: 12 }
        count: { type: integer, minimum: 0 }
    MonthlyCounts:
      type: object
      required: [year, months]
      properties:
        year: { type: integer }
        months:
          type: array
          minItems: 12
          maxItems: 12
          items: { $ref: '#/components/schemas/MonthlyCount' }
    AuditEvent:
      type: object
      required: [id, action, targetId, occurredAt]
      properties:
        id: { type: string, format: uuid }
        actorId:
          type: string
          format: uuid
          nullable: true
          description: Null when the acting administrator account has since been deleted.
        action: { type: string }
        targetId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
    AuditEventPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        nextCursor: { type: string, nullable: true }
    Problem:
      type: object
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
