plugins {
    id 'java-library'
    id 'jacoco'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.nexus'
version = rootProject.version

java {
    toolchain { languageVersion = JavaLanguageVersion.of(27) }
}

repositories { mavenCentral() }

javafx {
    version = '27.0.1'
    modules = ['javafx.controls']
}

dependencies {
    api project(':client-sdk')
    // The icon helper returns FontIcon and takes Feather constants, so both clients compile against
    // these types through this module's API.
    api 'org.kordamp.ikonli:ikonli-javafx:12.4.0'
    api 'org.kordamp.ikonli:ikonli-feather-pack:12.4.0'
    implementation 'tools.jackson.core:jackson-databind:3.3.0'
    implementation 'org.bouncycastle:bcmls-jdk18on:1.86'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 27
}

tasks.withType(Test).configureEach { useJUnitPlatform() }

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    // The shared UI facilities (the theme manager and the popup theme propagation) only run with a
    // toolkit, so the suites that exercise them are the clients' JavaFX suites. Their exec files
    // arrive from the fx-test job; when they are absent this report still measures the unit suite.
    executionData files(provider {
        def execs = [layout.buildDirectory.file('jacoco/test.exec').get().asFile]
        ['desktop-user', 'desktop-admin'].each { module ->
            def fxExec = rootProject.file("$module/build/jacoco/fxTest.exec")
            if (fxExec.exists()) execs.add(fxExec)
        }
        execs
    })
    reports {
        xml.required = true
        html.required = false
        csv.required = false
    }
}
