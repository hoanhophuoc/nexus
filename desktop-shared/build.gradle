plugins {
    id 'java-library'
    id 'jacoco'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.haichutieu.chatsystem'
version = rootProject.version

java {
    toolchain { languageVersion = JavaLanguageVersion.of(27) }
}

repositories { mavenCentral() }

javafx {
    version = '27.0.1'
    modules = ['javafx.controls']
}

dependencies {
    api project(':client-sdk')
    implementation 'tools.jackson.core:jackson-databind:3.3.0'
    implementation 'org.bouncycastle:bcmls-jdk18on:1.86'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 27
}

tasks.withType(Test).configureEach { useJUnitPlatform() }
