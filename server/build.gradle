plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.2'
}

group = 'com.haichutieu.chatsystem'
version = rootProject.version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    integrationTest {
        java.srcDir 'src/integrationTest/java'
        resources.srcDir 'src/integrationTest/resources'
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    // Flyway 13.12.1 is the newest release; the Boot 4.1.2 BOM still manages 12.4.0.
    implementation 'org.flywaydb:flyway-core:13.12.1'
    implementation 'org.flywaydb:flyway-database-postgresql:13.12.1'
    // Newest Jackson 3 release; the Boot 4.1.2 BOM still manages 3.1.7.
    implementation 'tools.jackson.core:jackson-databind:3.3.0'
    // Newest Lettuce release; the Boot 4.1.2 BOM still manages 7.5.2.
    implementation 'io.lettuce:lettuce-core:7.9.0.RELEASE'
    implementation 'com.password4j:password4j:1.8.4'
    // Newest SLF4J release; the Boot BOM manages the 2.0.x line.
    implementation 'org.slf4j:slf4j-api:2.1.0-alpha1'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
    integrationTestImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.5'
    integrationTestImplementation 'org.testcontainers:testcontainers:2.0.5'
    integrationTestImplementation 'org.testcontainers:testcontainers-postgresql:2.0.5'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 27
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named('bootJar') {
    archiveFileName = 'chat-server.jar'
}
tasks.named('jar') {
    enabled = false
}

tasks.register('integrationTest', Test) {
    description = 'Runs server PostgreSQL integration tests (requires Docker).'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
    maxParallelForks = 1
}
