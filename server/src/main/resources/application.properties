spring.application.name=chat-server
server.port=${CHAT_SERVER_PORT:8080}
chat.security.secure-cookie=${CHAT_SECURE_COOKIE:true}

spring.datasource.url=${CHAT_DB_URL:jdbc:postgresql://localhost:5432/chat_system}
spring.datasource.username=${CHAT_DB_USER:chat}
spring.datasource.password=${CHAT_DB_PASSWORD:chat}

spring.data.redis.host=${CHAT_REDIS_HOST:localhost}
spring.data.redis.port=${CHAT_REDIS_PORT:6379}
spring.data.redis.password=${CHAT_REDIS_PASSWORD:}
chat.presence.ttl-seconds=${CHAT_PRESENCE_TTL_SECONDS:90}
chat.presence.heartbeat-ms=${CHAT_PRESENCE_HEARTBEAT_MS:30000}

spring.mail.host=${CHAT_EMAIL_HOST:localhost}
spring.mail.port=${CHAT_EMAIL_PORT:25}
spring.mail.username=${CHAT_EMAIL_USERNAME:}
spring.mail.password=${CHAT_EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${CHAT_EMAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${CHAT_EMAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
chat.mail.from=${CHAT_EMAIL_FROM:no-reply@localhost}

spring.sql.init.mode=never
spring.flyway.schemas=chat_v1
spring.flyway.default-schema=chat_v1
spring.flyway.create-schemas=true

management.endpoints.web.exposure.include=health
# Mail is optional; an unreachable SMTP server must not make the API unhealthy.
management.health.mail.enabled=${CHAT_MAIL_HEALTH_ENABLED:false}
