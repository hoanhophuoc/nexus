spring.application.name=nexus-server
server.port=${NEXUS_SERVER_PORT:8080}
server.address=${NEXUS_SERVER_HOST:0.0.0.0}
nexus.security.secure-cookie=${NEXUS_SECURE_COOKIE:true}

spring.datasource.url=${NEXUS_DB_URL:jdbc:postgresql://localhost:5432/nexus}
spring.datasource.username=${NEXUS_DB_USER:nexus}
spring.datasource.password=${NEXUS_DB_PASSWORD:nexus}

# Blocking JDBC and Redis calls run on virtual threads; no request thread pool ceiling.
spring.threads.virtual.enabled=${NEXUS_VIRTUAL_THREADS:true}

# 10,000 concurrent sockets exceed Tomcat's default max-connections of 8,192.
server.tomcat.max-connections=${NEXUS_MAX_CONNECTIONS:20000}
server.tomcat.accept-count=${NEXUS_ACCEPT_COUNT:500}
server.tomcat.threads.max=${NEXUS_TOMCAT_THREADS:200}
server.tomcat.connection-timeout=20s

spring.datasource.hikari.maximum-pool-size=${NEXUS_DB_POOL_SIZE:16}
spring.datasource.hikari.minimum-idle=${NEXUS_DB_POOL_MIN_IDLE:4}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
# A parameterized LIKE is planned with default selectivity, so a reused generic plan walks the
# primary key in id order instead of the trigram indexes: 11.2 ms versus 0.2 ms for a search that
# matches nothing. Planning each execution costs microseconds and keeps the search selective.
spring.datasource.hikari.connection-init-sql=SET plan_cache_mode = force_custom_plan

spring.data.redis.host=${NEXUS_REDIS_HOST:localhost}
spring.data.redis.port=${NEXUS_REDIS_PORT:6379}
spring.data.redis.password=${NEXUS_REDIS_PASSWORD:}
nexus.presence.ttl-seconds=${NEXUS_PRESENCE_TTL_SECONDS:90}
nexus.presence.heartbeat-ms=${NEXUS_PRESENCE_HEARTBEAT_MS:30000}

spring.mail.host=${NEXUS_EMAIL_HOST:localhost}
spring.mail.port=${NEXUS_EMAIL_PORT:25}
spring.mail.username=${NEXUS_EMAIL_USERNAME:}
spring.mail.password=${NEXUS_EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${NEXUS_EMAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${NEXUS_EMAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
nexus.mail.from=${NEXUS_EMAIL_FROM:no-reply@localhost}

spring.sql.init.mode=never
spring.flyway.schemas=nexus
spring.flyway.default-schema=nexus
spring.flyway.create-schemas=true

# Presence heartbeats must never queue behind the outbox publisher.
spring.task.scheduling.pool.size=${NEXUS_SCHEDULER_THREADS:2}

# Scraped over the private network; a public ingress must not forward /actuator/**.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=nexus-server
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Mail is optional; an unreachable SMTP server must not make the API unhealthy.
management.health.mail.enabled=${NEXUS_MAIL_HEALTH_ENABLED:false}
