// Test-only support shared by the JavaFX suites. It is a module rather than a source set because the
// JavaFX plugin puts the toolkit on the module path of main compilation only, so the desktop modules
// cannot publish a fixture the way java-test-fixtures would.
plugins {
    id 'java-library'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.nexus'
version = rootProject.version

java {
    toolchain { languageVersion = JavaLanguageVersion.of(27) }
}

repositories { mavenCentral() }

javafx {
    version = '27.0.1'
    modules = ['javafx.controls']
}

dependencies {
    // The contrast helpers name the Theme a measurement belongs to, so the suites read one report
    // format per theme. desktop-shared does not depend on this module, so the project graph stays
    // acyclic.
    api project(':desktop-shared')
    // The helpers assert with AssertJ, as the suites that use them do; the same version is declared
    // by every desktop module so no second copy can reach a test classpath.
    api 'org.assertj:assertj-core:3.27.7'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 27
}
