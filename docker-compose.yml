name: chat-system

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chat_system}
      POSTGRES_USER: ${POSTGRES_USER:-chat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chat}
    volumes:
      # PostgreSQL 18+ keeps its data in a versioned subdirectory of this path.
      - postgres-data:/var/lib/postgresql
    ports:
      # Loopback only, so a server started from an IDE can reach the database.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$CHAT_REDIS_PASSWORD\""]
    environment:
      CHAT_REDIS_PASSWORD: ${CHAT_REDIS_PASSWORD:-change-me}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$CHAT_REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CHAT_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-chat_system}
      CHAT_DB_USER: ${POSTGRES_USER:-chat}
      CHAT_DB_PASSWORD: ${POSTGRES_PASSWORD:-chat}
      CHAT_REDIS_HOST: redis
      CHAT_REDIS_PORT: 6379
      CHAT_REDIS_PASSWORD: ${CHAT_REDIS_PASSWORD:-change-me}
      CHAT_EMAIL_HOST: ${CHAT_EMAIL_HOST:-localhost}
      CHAT_EMAIL_PORT: ${CHAT_EMAIL_PORT:-25}
      CHAT_EMAIL_USERNAME: ${CHAT_EMAIL_USERNAME:-}
      CHAT_EMAIL_PASSWORD: ${CHAT_EMAIL_PASSWORD:-}
      CHAT_EMAIL_AUTH: ${CHAT_EMAIL_AUTH:-false}
      CHAT_EMAIL_STARTTLS: ${CHAT_EMAIL_STARTTLS:-false}
      CHAT_EMAIL_FROM: ${CHAT_EMAIL_FROM:-no-reply@localhost}
      CHAT_MAIL_HEALTH_ENABLED: ${CHAT_MAIL_HEALTH_ENABLED:-false}
      CHAT_SECURE_COOKIE: ${CHAT_SECURE_COOKIE:-true}
      CHAT_SERVER_HOST: 0.0.0.0
      CHAT_SERVER_PORT: 8080
    ports:
      - "${CHAT_SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
