name: nexus

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus}
    volumes:
      # PostgreSQL 18+ keeps its data in a versioned subdirectory of this path.
      - postgres-data:/var/lib/postgresql
    ports:
      # Loopback only, so a server started from an IDE can reach the database.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$NEXUS_REDIS_PASSWORD\""]
    environment:
      NEXUS_REDIS_PASSWORD: ${NEXUS_REDIS_PASSWORD:-change-me}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$NEXUS_REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NEXUS_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-nexus}
      NEXUS_DB_USER: ${POSTGRES_USER:-nexus}
      NEXUS_DB_PASSWORD: ${POSTGRES_PASSWORD:-nexus}
      NEXUS_REDIS_HOST: redis
      NEXUS_REDIS_PORT: 6379
      NEXUS_REDIS_PASSWORD: ${NEXUS_REDIS_PASSWORD:-change-me}
      NEXUS_EMAIL_HOST: ${NEXUS_EMAIL_HOST:-localhost}
      NEXUS_EMAIL_PORT: ${NEXUS_EMAIL_PORT:-25}
      NEXUS_EMAIL_USERNAME: ${NEXUS_EMAIL_USERNAME:-}
      NEXUS_EMAIL_PASSWORD: ${NEXUS_EMAIL_PASSWORD:-}
      NEXUS_EMAIL_AUTH: ${NEXUS_EMAIL_AUTH:-false}
      NEXUS_EMAIL_STARTTLS: ${NEXUS_EMAIL_STARTTLS:-false}
      NEXUS_EMAIL_FROM: ${NEXUS_EMAIL_FROM:-no-reply@localhost}
      NEXUS_MAIL_HEALTH_ENABLED: ${NEXUS_MAIL_HEALTH_ENABLED:-false}
      NEXUS_SECURE_COOKIE: ${NEXUS_SECURE_COOKIE:-true}
      NEXUS_SERVER_HOST: 0.0.0.0
      NEXUS_SERVER_PORT: 8080
    ports:
      - "${NEXUS_SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
