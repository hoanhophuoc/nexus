# Database Connection Settings
hibernate.connection.provider_class=org.hibernate.hikaricp.internal.HikariCPConnectionProvider
hibernate.hikari.dataSourceClassName=org.postgresql.ds.PGSimpleDataSource
hibernate.hikari.dataSource.url=jdbc:postgresql://localhost:5432/chat_system
hibernate.hikari.dataSource.user=chat
hibernate.hikari.dataSource.password=chat

# Schema management: "update" lets a fresh database create its tables.
# Set CHAT_DB_DDL_AUTO=none for a managed/production database.
hibernate.hbm2ddl.auto=update

# Hibernate Transaction Settings
hibernate.transaction.coordinator_class=jdbc
# Hibernate 7 returns java.time types from native queries by default; the DTOs use java.sql.Timestamp.
hibernate.query.native.prefer_jdbc_datetime_types=true

# HikariCP Connection Pool Settings
hibernate.hikari.maximumPoolSize=20
hibernate.hikari.minimumIdle=2
hibernate.hikari.idleTimeout=300000
hibernate.hikari.maxLifetime=1800000
hibernate.hikari.connectionTimeout=30000
hibernate.hikari.poolName=ChatSystemPool

# server setup
server.host=localhost
server.port=8080

# email setup (optional, used by "forgot password")
email.username=
email.password=
